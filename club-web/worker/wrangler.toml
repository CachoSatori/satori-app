# Worker «satori-club-api» (10-nov): atiende /api/* del dominio del Club con los topes por IP. Es el único camino de la
# API (12-nov): Pages no admite estos topes en su configuración. Pasos de panel: docs/pases/PASE-150-151-club.md §11.
#
# · Sin rutas ni dominio: al Worker solo lo llama la Pages Function por el service binding CLUB_API, que se carga en el
#   panel de Pages (satori-club → Settings → Bindings → Service binding CLUB_API → satori-club-api).
# · Variables y secretos en el panel del Worker: SUPABASE_URL y SUPABASE_ANON_KEY (texto), TURNSTILE_SECRET y
#   CLUB_WEB_KEY (Secret). Los mismos valores que en Pages. (12-nov) CLUB_PASE_SYNC_KEY (Secret), la misma que el
#   secreto del Edge club-pase: sin ella, el cron de abajo no hace nada.
name = "satori-club-api"
main = "index.js"
compatibility_date = "2025-10-01"
workers_dev = false   # sin URL pública *.workers.dev: al Worker solo lo llama el service binding de Pages
preview_urls = false  # (11-nov) sin URLs de vista previa: explícito, para que un deploy no las encienda ni las deje a criterio del panel
keep_vars = true      # un deploy no borra las variables cargadas en el panel

# Topes por IP (CLUB-AUD-14 y 24). Los dos son OBLIGATORIOS: sin ellos la API responde 503 (falla cerrada).
#   RL_CREAR: crear cupón, opt-in, alta, bajas y código de canje (5 por 60 s por IP)
#   RL_LEER:  ver cupón y portal (60 por 60 s por IP)
[[unsafe.bindings]]
name = "RL_CREAR"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_LEER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 60, period = 60 }

# (12-nov, opción c del dueño) Cada 10 minutos: el Edge club-pase vence en Google Wallet los pases de las personas dadas
# de baja (programado.js → POST /functions/v1/club-pase/vencer). Sin el Secret CLUB_PASE_SYNC_KEY, no hace nada.
[triggers]
crons = ["*/10 * * * *"]
