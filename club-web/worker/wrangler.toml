# Plan B de club-web (10-nov): Worker «satori-club-api» que atiende /api/* del dominio del Club con los topes por IP.
# Se usa SOLO si, después del primer deploy de Pages, /api/salud dice rl_crear o rl_leer en false (Pages no tomó los
# bindings). Pasos de panel: docs/pases/PASE-150-151-club.md §11.
#
# · La ruta «<dominio>/api/*» se agrega en el panel (Worker → Settings → Domains & Routes): el dominio no se escribe en
#   el repo (src/dominioRepo.test.ts).
# · Variables y secretos en el panel del Worker: SUPABASE_URL y SUPABASE_ANON_KEY (texto), TURNSTILE_SECRET y
#   CLUB_WEB_KEY (Secret). Los mismos valores que en Pages.
name = "satori-club-api"
main = "index.js"
compatibility_date = "2025-10-01"
workers_dev = false   # sin URL pública *.workers.dev: al Worker solo lo llama el service binding de Pages
preview_urls = false  # (11-nov) sin URLs de vista previa: explícito, para que un deploy no las encienda ni las deje a criterio del panel
keep_vars = true      # un deploy no borra las variables cargadas en el panel

# Topes por IP (CLUB-AUD-14 y 24): los mismos que en ../wrangler.toml. Espacios de nombres propios del Worker.
[[unsafe.bindings]]
name = "RL_CREAR"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_LEER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 60, period = 60 }
