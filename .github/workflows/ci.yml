# Gate de los PR contra main: lo mismo que cada sesión corría a mano antes de pedir merge.
# Sin secretos: las variables de build son FICTICIAS (el bundle de un PR no se publica en ningún lado) y las
# pruebas usan sus propios valores falsos de Supabase (vite.config.ts → test.env). El log es público.
# Para que bloquee el merge, el dueño marca el check «Gate» como requerido en la protección de main.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Node 22, igual que deploy.yml. Con Node 20 las pruebas no corren: @supabase/realtime-js exige WebSocket
      # nativo (Node 22+) al crear el cliente (corrida 43374987628 de este PR).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Misma clave que deploy.yml (package-lock.json de la raíz): los PR reusan el cache que guarda main.
          cache: npm

      # Una sola definición del gate: scripts/ci/gate.sh (npm ci, tsc -b, build de producción con variables ficticias,
      # grep anti-diagnóstico, vitest —incluye club-web—, lint contra línea base y build de club-web). La última línea
      # del log es «GATE: PASS …» o «GATE: FAIL paso=…». Local: `bash scripts/ci/gate.sh`.
      - name: Gate (scripts/ci/gate.sh)
        run: bash scripts/ci/gate.sh
