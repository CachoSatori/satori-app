# Gate de los PR contra main: lo mismo que cada sesión corría a mano antes de pedir merge.
# Sin secretos: las variables de build son FICTICIAS (el bundle de un PR no se publica en ningún lado) y las
# pruebas usan sus propios valores falsos de Supabase (vite.config.ts → test.env). El log es público.
# Para que bloquee el merge, el dueño marca el check «Gate» como requerido en la protección de main.
name: CI

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled: la etiqueta `ok-dueno-edge` (excepción de la guarda R04) vuelve a correr el gate. edited: solo corre
    # el Gate si cambió la BASE (ver el `if` del job); editar el título o el cuerpo del PR no gasta una corrida.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  # Para que main también tenga su línea «GATE: PASS …» (sin base: las guardas del diff se saltan, lo dice el log).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    # (19-nov) SIN `if` a nivel de job: un job saltado cuenta como «Success» para un check requerido (y con `edited` cancelaría
    # el Gate en curso por la concurrency). Con `edited` el Gate corre completo. Lo cuida scripts/ci/workflows.test.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Historia completa: las guardas del diff (R04, R14, R16) comparan contra el SHA base del PR.
          fetch-depth: 0

      # Node 22, igual que deploy.yml. Con Node 20 las pruebas no corren: @supabase/realtime-js exige WebSocket
      # nativo (Node 22+) al crear el cliente (corrida 43374987628 de este PR).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Misma clave que deploy.yml (package-lock.json de la raíz): los PR reusan el cache que guarda main.
          cache: npm

      # Una sola definición del gate: scripts/ci/gate.sh (npm ci, tsc -b, build de producción con variables ficticias,
      # grep anti-diagnóstico, vitest —incluye club-web—, lint contra línea base y build de club-web). La última línea
      # del log es «GATE: PASS …» o «GATE: FAIL paso=…». Local: `bash scripts/ci/gate.sh`.
      - name: Gate (scripts/ci/gate.sh)
        env:
          # Cabeza del PR (no el commit de fusión) para la línea «GATE: PASS sha=…»; vacío en un push a main.
          GATE_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/ci/gate.sh
